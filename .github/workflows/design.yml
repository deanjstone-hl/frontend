name: Design

on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push replaces its older run; a push to main has a group of its
# own (its SHA), so it is never cancelled (design-system#184).
# No token by default: each job below asks for the one scope it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    name: Slop detector
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Pinned deliberately: the detector's rule set defines whether this check
      # passes, so an unpinned range could fail the build on someone else's release.
      - name: Detect UI anti-patterns
        run: npx --yes impeccable@3.6.1 detect registry/ theme/

  registry:
    name: Registry output current
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # r/ is generated from registry.json and the sources it points at, and it
      # is what tagged URLs resolve against — so a stale r/ silently serves
      # consumers an older component than the tag claims. Rebuilding and
      # diffing is the only thing that catches it; nothing else in CI reads r/.
      - name: Rebuild per-item output and fail if it drifted
        run: |
          npx --yes shadcn@4.19.1 build --output ./r
          if ! git diff --quiet -- r/; then
            echo "::error::r/ is out of date. Run 'npx shadcn build --output ./r' and commit the result."
            git diff --stat -- r/
            exit 1
          fi
          echo "r/ matches registry.json and the current sources."
