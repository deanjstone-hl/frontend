name: Design check

# Two checks on the UI files a PR changes. Shipped by the frontend
# `design-check` registry item.
#   - Impeccable's design detector. It runs no AI model: it flags low contrast,
#     AI-slop patterns and drift from DESIGN.md. Findings are written to the job
#     summary and never block a merge.
#   - The design rules (scripts/design-rules.mjs): iPhone safe-area and touch rules,
#     such as min-h-screen, a missing viewport-fit=cover, fixed elements with no
#     safe edge, a bare env(safe-area-inset-left|right), and form text under 16px.
#     A finding fails the job. A line that is right for a reason the rule cannot
#     see takes a `design-rules-ignore` comment.
#   - The stale-copy report (scripts/registry-stale.mjs). Moving the `@frontend` pin
#     does not move the registry files already copied into the app; this lists the
#     copies that match an older release than the pin. Warn-only: it never blocks.

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.css'
      - '**/*.html'
      - '**/*.vue'
      - '**/*.svelte'
      - 'DESIGN.md'
      - 'components.json'
      - '.impeccable/**'
      - 'scripts/design-detect.sh'
      - 'scripts/design-rules.mjs'
      - 'scripts/registry-stale.mjs'
      - '.github/workflows/design-detect.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    # A hosted runner on purpose: a runner chosen by a repository variable would put
    # the check back on a self-hosted slot after the next `shadcn add`. Keep it hosted.
    runs-on: ubuntu-latest
    steps:
      # The script diffs against the base commit, so the history back to it is needed;
      # blob:none keeps that to commits and trees.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # continue-on-error: the detector exits 2 on findings and 1 when a target could
      # not be scanned. Either shows as a failed step here, never as a failed check.
      # Run through bash: `shadcn add` does not set the executable bit.
      - name: Run the detector on changed UI files
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/design-detect.sh "$BASE_SHA"

      # continue-on-error: the report exits 2 when a copy is older than the pin and 1 when
      # the registry could not be read. Either shows as a failed step, never a failed check.
      # Move this off continue-on-error to make stale copies block.
      # Before the rules step, which blocks: a failed rules step would skip this report.
      - name: Report registry copies older than the pin
        continue-on-error: true
        run: node scripts/registry-stale.mjs

      # No continue-on-error: this one blocks. It reads only the files the PR changed.
      - name: Check the design rules
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/design-rules.mjs "$BASE_SHA"
